<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasca de Rotació Mental (Vandenberg & Kuse)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
        }

        h2, h3 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .hidden {
            display: none !important;
        }

        /* Estils de la tasca */
        .task-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
            color: #7f8c8d;
            border-bottom: 1px solid #ecf0f1;
            padding-bottom: 10px;
        }

        .target-box {
            text-align: center;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px dashed #cbd5e1;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-card {
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-card:hover {
            border-color: var(--secondary);
        }

        .option-card.selected {
            border-color: var(--secondary);
            background-color: #ebf5fb;
        }

        .shape-preview {
            font-family: monospace;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--primary);
            margin: 10px 0;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .results-table th, .results-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            font-size: 14px;
        }

        .results-table th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- FASE 1: FORMULARI DE REGISTRE -->
    <div id="view-form">
        <h2>Tasca de Rotació Mental</h2>
        <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 25px;">
            Basada en el paradigma de Vandenberg & Kuse (1978)
        </p>
        
        <form id="participant-form">
            <div class="form-group">
                <label for="name">Nom / Àlies:</label>
                <input type="text" id="name" required placeholder="Introdueix el teu nom o codi">
            </div>

            <div class="form-group">
                <label for="dob">Data de naixement:</label>
                <input type="date" id="dob" required>
            </div>

            <div class="form-group">
                <label for="handedness">Dominància manual:</label>
                <select id="handedness" required>
                    <option value="">Selecciona...</option>
                    <option value="Dretà">Dretà/na</option>
                    <option value="Esquerrà">Esquerrà/ana</option>
                    <option value="Ambidextre">Ambidextre/a</option>
                </select>
            </div>

            <div class="form-group">
                <label for="gender">Sexe:</label>
                <select id="gender" required>
                    <option value="">Selecciona...</option>
                    <option value="Masculí">Masculí</option>
                    <option value="Femení">Femení</option>
                    <option value="No respon">Prefereixo no respondre</option>
                </select>
            </div>

            <button type="submit">Començar la prova</button>
        </form>
    </div>

    <!-- FASE 2: LA TASCA DE ROTACIÓ -->
    <div id="view-task" class="hidden">
        <div class="task-header">
            <span>Prova <span id="current-trial">1</span> / <span id="total-trials">5</span></span>
            <span>Selecciona exactament 2 correctes</span>
        </div>

        <div class="target-box">
            <div style="font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px;">FIGURA OBJECTIU</div>
            <div class="shape-preview" id="target-shape">L-Z-T</div>
        </div>

        <p style="font-size: 14px; text-align: center; margin-bottom: 10px; font-weight: 500;">
            Clica sobre les <strong>2 figures</strong> de sota que corresponguin a la mateixa figura girada:
        </p>

        <div class="options-grid" id="options-container">
            <!-- Es generaran dinàmicament -->
        </div>

        <button id="btn-confirm" disabled onclick="app.submitTrial()">Confirmar Selecció</button>
    </div>

    <!-- FASE 3: RESULTATS I EXPORTACIÓ -->
    <div id="view-results" class="hidden">
        <h2>Resultats de la Prova</h2>
        <p id="participant-summary" style="text-align: center; font-weight: 500; color: #555;"></p>

        <table class="results-table">
            <thead>
                <tr>
                    <th>Prova</th>
                    <th>Temps (s)</th>
                    <th>Encerts (0-2)</th>
                    <th> estat</th>
                </tr>
            </thead>
            <tbody id="results-tbody">
                <!-- Dades de resultats -->
            </tbody>
        </table>

        <button onclick="app.downloadJSON()">Descarregar Dades (JSON)</button>
    </div>
</div>

<script>
    class MentalRotationApp {
        constructor() {
            this.participant = {};
            this.trials = [
                { target: "▲-■-●", correct: [0, 2], options: ["▲-■-●", "●-■-▲", "▲-■-●", "■-●-▲"] },
                { target: "T-X-Z", correct: [1, 3], options: ["Z-X-T", "T-X-Z", "X-T-Z", "T-X-Z"] },
                { target: "★-◆-▲", correct: [0, 3], options: ["★-◆-▲", "▲-◆-★", "◆-★-▲", "★-◆-▲"] },
                { target: "■-▲-●", correct: [1, 2], options: ["●-▲-■", "■-▲-●", "■-▲-●", "▲-■-●"] },
                { target: "Z-T-X", correct: [0, 2], options: ["Z-T-X", "X-T-Z", "Z-T-X", "T-Z-X"] }
            ];
            this.currentTrialIndex = 0;
            this.selectedOptions = [];
            this.trialStartTime = 0;
            this.results = [];

            this.initListeners();
        }

        initListeners() {
            document.getElementById('participant-form').addEventListener('submit', (e) => {
                e.preventDefault();
                this.participant = {
                    name: document.getElementById('name').value,
                    dob: document.getElementById('dob').value,
                    handedness: document.getElementById('handedness').value,
                    gender: document.getElementById('gender').value
                };
                this.startTask();
            });
        }

        startTask() {
            document.getElementById('view-form').classList.add('hidden');
            document.getElementById('view-task').classList.remove('hidden');
            document.getElementById('total-trials').textContent = this.trials.length;
            this.loadTrial();
        }

        loadTrial() {
            this.selectedOptions = [];
            document.getElementById('btn-confirm').disabled = true;
            document.getElementById('current-trial').textContent = this.currentTrialIndex + 1;

            const trial = this.trials[this.currentTrialIndex];
            document.getElementById('target-shape').textContent = trial.target;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            trial.options.forEach((opt, idx) => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.innerHTML = `
                    <div style="font-size: 12px; color: #888;">Opció ${idx + 1}</div>
                    <div class="shape-preview">${opt}</div>
                `;
                card.onclick = () => this.toggleOption(idx, card);
                container.appendChild(card);
            });

            this.trialStartTime = performance.now();
        }

        toggleOption(idx, cardElement) {
            const indexInSelected = this.selectedOptions.indexOf(idx);
            
            if (indexInSelected > -1) {
                this.selectedOptions.splice(indexInSelected, 1);
                cardElement.classList.remove('selected');
            } else {
                if (this.selectedOptions.length < 2) {
                    this.selectedOptions.push(idx);
                    cardElement.classList.add('selected');
                }
            }

            // Habilitar botó només si se n'han seleccionat exactament 2
            document.getElementById('btn-confirm').disabled = this.selectedOptions.length !== 2;
        }

        submitTrial() {
            const trialEndTime = performance.now();
            const reactionTime = (trialEndTime - this.trialStartTime) / 1000; // en segons

            const currentTrial = this.trials[this.currentTrialIndex];
            
            // Comprovar encerts (exactament les 2 correctes)
            const sortedSelected = [...this.selectedOptions].sort();
            const sortedCorrect = [...currentTrial.correct].sort();
            const isCorrectMatch = JSON.stringify(sortedSelected) === JSON.stringify(sortedCorrect);
            
            // Comptar encerts parcials o totals (0 a 2)
            let score = 0;
            this.selectedOptions.forEach(opt => {
                if (currentTrial.correct.includes(opt)) score++;
            });

            this.results.push({
                trial: this.currentTrialIndex + 1,
                reactionTime: reactionTime.toFixed(2),
                score: isCorrectMatch ? 2 : score,
                correct: isCorrectMatch
            });

            this.currentTrialIndex++;
            if (this.currentTrialIndex < this.trials.length) {
                this.loadTrial();
            } else {
                this.showResults();
            }
        }

        showResults() {
            document.getElementById('view-task').classList.add('hidden');
            document.getElementById('view-results').classList.remove('hidden');

            document.getElementById('participant-summary').textContent = 
                `Participant: ${this.participant.name} (${this.participant.gender}, ${this.participant.handedness})`;

            const tbody = document.getElementById('results-tbody');
            tbody.innerHTML = '';

            this.results.forEach(res => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${res.trial}</td>
                    <td>${res.reactionTime} s</td>
                    <td>${res.score} / 2</td>
                    <td>${res.correct ? '✅ Correcte' : '❌ Incorrecte'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        downloadJSON() {
            const dataObj = {
                participant: this.participant,
                results: this.results,
                timestamp: new Date().toISOString()
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataObj, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `resultats_rotacio_${this.participant.name.replace(/\s+/g, '_')}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    }

    const app = new MentalRotationApp();
</script>

</body>
</html>
