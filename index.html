<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Rotations Test (MRT 3D) - Vandenberg & Kuse</title>
    <!-- Carreguem Three.js per a gràfics 3D reals -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #1e293b;
            --secondary: #0284c7;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 750px;
            box-sizing: border-box;
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background: #fff;
        }

        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #0369a1;
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .target-box {
            text-align: center;
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 2px dashed #94a3b8;
        }

        .target-label {
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-card {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-card:hover {
            border-color: var(--secondary);
            transform: translateY(-2px);
        }

        .option-card.selected {
            border-color: var(--secondary);
            background-color: #e0f2fe;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
        }

        .option-id {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 12px;
            font-weight: bold;
            color: #64748b;
            z-index: 10;
        }

        .canvas-container {
            width: 100%;
            height: 120px;
        }

        .target-canvas-container {
            width: 100%;
            height: 110px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .results-table th, .results-table td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }

        .results-table th {
            background-color: #f1f5f9;
            color: #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- FASE 1: FORMULARI DE REGISTRE -->
    <div id="view-form">
        <h2>Mental Rotations Test (MRT 3D)</h2>
        <p class="subtitle">Rèplica experimental basada en Vandenberg & Kuse (1978)</p>
        
        <form id="participant-form">
            <div class="form-group">
                <label for="name">Nom / Identificador de Participant:</label>
                <input type="text" id="name" required placeholder="Ex: P001">
            </div>

            <div class="form-group">
                <label for="dob">Data de naixement:</label>
                <input type="date" id="dob" required>
            </div>

            <div class="form-group">
                <label for="handedness">Dominància manual:</label>
                <select id="handedness" required>
                    <option value="">Selecciona...</option>
                    <option value="Dretà">Dretà/na</option>
                    <option value="Esquerrà">Esquerrà/ana</option>
                    <option value="Ambidextre">Ambidextre/a</option>
